<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Log Viewer</title>
<style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    #log { 
        white-space: pre-wrap; 
        background: #222; 
        padding: 10px; 
        border-radius: 6px; 
        height: 80vh;
        overflow-y: auto;
    }
    input { padding: 6px; width: 300px; margin-bottom: 10px; }

    /* Existing color coding */
    .info { color: #4da6ff; }
    .warn { color: #ffcc00; }
    .error { color: #ff6666; }

    /* ⭐ New highlight for “New Additional Item” */
    .newitem { color: #00ff99; font-weight: bold; }
    .prioritymatch {color: #ff66ff; font-weight: bold; }

    /* Flag dropped on the last visible line every ~10 auto-scrolled lines */
    .scrollflag { background: #3a2f00; border-left: 3px solid #ffcc00; }
    .scrollflag::before { content: "\2691 "; color: #ffcc00; }
	
	// ⭐ Highlight "Priority match found"
    if (lower.includes("priority match found"))
        return `<span class="prioritymatch">${line}</span>`;


</style></head>
<body>

<h2>Live Log Viewer</h2>

<label>Filter text: </label>
<input id="filter" type="text" placeholder="Type to filter..." oninput="render()">

<pre id="log"></pre>

<script>
let fullLog = "";
let lastRendered = "";

// Auto-scroll flagging: every FLAG_EVERY lines scrolled in, flag the last displayed line
const FLAG_EVERY = 10;
const flaggedLines = new Set();   // indices into fullLog lines
let lastLineCount = 0;            // fullLog line count at previous render
let lastDisplayedCount = 0;       // displayed (filtered) line count at previous render
let scrolledSinceFlag = 0;

async function fetchLog() {
    try {
        const res = await fetch("/log");
        fullLog = await res.text();
        render(true);
    } catch {
        document.getElementById("log").textContent = "Error loading log";
    }
}

function colorize(line) {
    const lower = line.toLowerCase();

    // ⭐ Highlight lines containing “New Additional Item”
    if (lower.includes("new additional item"))
        return `<span class="newitem">${line}</span>`;

    // Existing rules
    if (lower.includes("error")) return `<span class="error">${line}</span>`;
    if (lower.includes("warn")) return `<span class="warn">${line}</span>`;
    if (lower.includes("info")) return `<span class="info">${line}</span>`;

    return line;
}

function render(autoScroll = false) {
    const filter = document.getElementById("filter").value.toLowerCase();
    const lines = fullLog.split("\n");

    // Log was truncated/rotated: old flag positions are meaningless
    if (lines.length < lastLineCount) {
        flaggedLines.clear();
        scrolledSinceFlag = 0;
        lastDisplayedCount = 0;
    }
    lastLineCount = lines.length;

    const filtered = [];
    lines.forEach((line, i) => {
        if (line.trim() && (!filter || line.toLowerCase().includes(filter)))
            filtered.push(i);
    });

    const logEl = document.getElementById("log");
    const rawText = filtered.map(i => lines[i]).join("\n");
    const shouldScroll = autoScroll && (rawText !== lastRendered);

    if (shouldScroll && lastRendered !== "") {
        scrolledSinceFlag += Math.max(0, filtered.length - lastDisplayedCount);
        if (scrolledSinceFlag >= FLAG_EVERY && filtered.length) {
            flaggedLines.add(filtered[filtered.length - 1]);
            scrolledSinceFlag = 0;
        }
    }
    lastDisplayedCount = filtered.length;
    lastRendered = rawText;

    logEl.innerHTML = filtered.map(i => {
        const html = colorize(lines[i]);
        return flaggedLines.has(i) ? `<span class="scrollflag">${html}</span>` : html;
    }).join("\n");

    if (shouldScroll) {
        logEl.scrollTop = logEl.scrollHeight;
    }
}

// poll every 2 seconds
setInterval(fetchLog, 2000);
fetchLog();
</script>
</body>
</html>
